<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Background Example</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1; /* Ensure it’s behind other content */
    }

    #background-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ensures the video covers the area */
      transform: translate(-50%, -50%);
    }

    .content {
      position: relative;
      z-index: 1; /* Ensures content is above the video */
      color: white;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5); /* Optional: add a semi-transparent background for better text visibility */
    }
  </style>
</head>
<body>
  <div class="video-background">
    <video autoplay muted loop id="background-video">
      <source src="assets/images/" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <div class="content">
    <h1>Welcome to My Website</h1>
    <p>This is some content on top of the video background.</p>
  </div>
</body>
</html>
